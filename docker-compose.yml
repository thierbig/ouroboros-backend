services:
  api:
    build: .
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - MONGODB_DB=ouroboros_sandbox
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
    restart: unless-stopped
